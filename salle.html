<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ELECARM SAS - Salle d'attente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--mono:'JetBrains Mono',monospace}
html,body{min-height:100vh;background:#070809;color:#d4d4d4;font-family:Inter,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:640px;padding:28px 16px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:30px}
.logo-mark{width:34px;height:34px;background:#7f1d1d;border-radius:5px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:19px;height:19px;fill:#fff}
.logo-txt{font-size:14px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase}
.logo-sub{font-size:10px;color:#555;letter-spacing:.08em;text-transform:uppercase;margin-top:2px;text-align:left}
.tag{font-size:11px;font-weight:700;letter-spacing:.16em;color:#8a5a5a;text-transform:uppercase;margin-bottom:16px}
.status{font-size:22px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:14px}
.hint{font-size:14px;color:#8a8a8a;line-height:1.7;max-width:460px;margin:0 auto}
.count{font-family:var(--mono);font-size:64px;font-weight:700;color:#fff;letter-spacing:.04em;margin:10px 0 16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3a3a3a;margin-right:8px;vertical-align:middle}
.dot.live{background:#dc2626;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.flash{font-size:26px;font-weight:800;letter-spacing:.14em;color:#dc2626;text-transform:uppercase;animation:pulse 1s infinite}
.foot{margin-top:36px;font-size:11px;color:#3a3a3a;letter-spacing:.05em}
.spin{width:34px;height:34px;border:3px solid #1c1c1c;border-top-color:#7f1d1d;border-radius:50%;margin:0 auto 20px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Inscription */
.card{background:#0e0f11;border:1px solid #1e2024;border-radius:9px;padding:20px;text-align:left;margin:0 auto 22px;max-width:520px}
.card h2{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a8a8a;margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:#777;letter-spacing:.05em;text-transform:uppercase;margin:12px 0 6px}
input{width:100%;background:#08090a;border:1px solid #26292d;color:#e6e6e6;padding:10px 12px;font-size:14px;border-radius:6px;outline:none;font-family:inherit}
input:focus{border-color:#4a4f55}
.teams{display:flex;flex-direction:column;gap:6px}
.team{display:flex;align-items:center;gap:10px;background:#08090a;border:1px solid #1e2024;border-radius:6px;padding:9px 12px}
.team-n{font-weight:700;color:#fff;font-size:14px}
.team-m{font-size:11px;color:#666;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.team-c{margin-left:auto;font-family:var(--mono);font-size:12px;color:#8a8a8a;white-space:nowrap}
button{border:none;border-radius:6px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:#7f1d1d;color:#fff}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid #2a2d31;color:#9a9a9a;font-weight:600}
.row{display:flex;gap:8px}
.tds{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.td{background:#08090a;border:1px solid #26292d;color:#fff;font-size:22px;font-weight:800;letter-spacing:.06em;padding:22px 10px;border-radius:8px}
.td small{display:block;font-size:11px;font-weight:600;color:#777;letter-spacing:.04em;margin-top:6px}
.td:hover,.grp:not(:disabled):hover{border-color:#7f1d1d;background:#140b0b}
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grp{background:#08090a;border:1px solid #26292d;color:#fff;text-align:left;padding:14px;border-radius:8px}
.grp-n{font-size:16px;font-weight:800}
.grp-c{font-family:var(--mono);font-size:12px;color:#8a8a8a;margin-top:4px}
.grp-m{font-size:11px;color:#666;font-weight:500;margin-top:6px;line-height:1.5;min-height:16px}
.bar{height:4px;background:#1c1d20;border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#7f1d1d}
.grp:disabled .bar i{background:#3a3a3a}
.back{background:none;border:none;color:#8a8a8a;font-weight:600;padding:0;margin-bottom:12px;font-size:12px}
.back:hover{color:#fff}
.pick{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px}
.join{width:100%;margin-top:14px;padding:13px;font-size:15px}
.row input{flex:1}
.or{font-size:11px;color:#555;text-align:center;margin:14px 0 2px;letter-spacing:.1em;text-transform:uppercase}
.err{color:#fca5a5;font-size:12px;min-height:16px;margin-top:10px}
.me{font-size:14px;color:#9a9a9a;line-height:1.7}
.me b{color:#fff}
.empty{font-size:12px;color:#555;padding:6px 0}
#cfm{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px}
#cfm.show{display:flex}
#cfm .cfm-box{background:#131313;border:1px solid #2a2a2a;border-radius:10px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.7);text-align:left}
#cfm-t{font-size:14px;color:#e6e6e6;line-height:1.6;white-space:pre-wrap;margin-bottom:16px}
#cfm .cfm-row{display:flex;gap:10px;justify-content:flex-end}
#cfm button{border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
#cfm-no{background:#1c1c1c;color:#aaa;border:1px solid #2a2a2a!important}
#cfm-ok{background:#7f1d1d;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zM12 4.5l7 3.5v8.5l-7 3.5-7-3.5V8l7-3.5z"/></svg></div>
    <div>
      <div class="logo-txt">ELECARM SAS</div>
      <div class="logo-sub">Operation Silent Gateway</div>
    </div>
  </div>

  <!-- Inscription (affichee tant que ce poste n'a pas de groupe) : TD, puis groupe, puis nom -->
  <div id="reg" class="card" style="display:none">
    <div id="step-td">
      <h2>1. Votre TD</h2>
      <div class="tds" id="tds"></div>
    </div>
    <div id="step-grp" style="display:none">
      <button class="back" onclick="pickTd(null)">&larr; Changer de TD</button>
      <h2>2. Votre groupe, <span id="grp-td"></span></h2>
      <div class="grps" id="grps"></div>
    </div>
    <div id="step-name" style="display:none">
      <button class="back" onclick="pickGroup(null)">&larr; Changer de groupe</button>
      <h2>3. Votre nom</h2>
      <div class="pick" id="pick"></div>
      <div class="me" id="pick-m"></div>
      <label for="mname">Nom et prénom</label>
      <input id="mname" maxlength="40" autocomplete="off" placeholder="Ex. : Durand Léa" onkeydown="if(event.key==='Enter')join()">
      <button class="join" id="joinbtn" onclick="join()">Rejoindre</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <!-- Equipe de ce poste -->
  <div id="mine" class="card" style="display:none">
    <h2>Votre groupe</h2>
    <div class="me" id="me"></div>
    <div style="margin-top:12px"><button class="ghost" id="leave" onclick="leave()">Changer de groupe</button></div>
  </div>

  <div id="view"></div>
  <div class="foot"><span id="statedot" class="dot"></span><span id="statelabel">Connexion...</span></div>
</div>
<div id="cfm"><div class="cfm-box"><div id="cfm-t"></div><div class="cfm-row"><button id="cfm-no">Annuler</button><button id="cfm-ok">Confirmer</button></div></div></div>
<script>
// Confirmation dans la page (et non confirm() du navigateur, que l'on peut bloquer par une case à cocher).
function ask(text, then){
  var box=document.getElementById('cfm'), ok=document.getElementById('cfm-ok'), no=document.getElementById('cfm-no');
  document.getElementById('cfm-t').textContent=text; box.classList.add('show'); ok.focus();
  function close(v){ box.classList.remove('show'); ok.onclick=no.onclick=box.onclick=null; document.removeEventListener('keydown',key); if(v) then(); }
  function key(e){ if(e.key==='Escape') close(false); if(e.key==='Enter'){ e.preventDefault(); close(true); } }
  ok.onclick=function(){ close(true); }; no.onclick=function(){ close(false); };
  box.onclick=function(e){ if(e.target===box) close(false); };
  document.addEventListener('keydown',key);
}
// Lien unique donne aux eleves : inscription d'equipe, salle d'attente, compte a rebours,
// puis ouverture de l'exercice (intro "/" puis "/exercice") pour tout le monde en meme temps.
var API = '/api/session';
var TEAM_API = '/api/team';
var EXO = '/';
var POLL = 3000;
var KEY = 'elecarm_team';

var cur = null;          // dernier etat serveur
var offset = 0;          // decalage horloge serveur - horloge locale
var launched = false;
var lastSig = '';
var goneCount = 0;
var view = document.getElementById('view');
var dot = document.getElementById('statedot'), label = document.getElementById('statelabel');

// Version de l'état déjà vue (partagée avec l'exercice) : le serveur ne renvoie jamais plus ancien.
function seenRev(){ try{ return +localStorage.getItem('elecarm_rev')||0; }catch(e){ return 0; } }
function noteRev(r){ if(r>seenRev()){ try{ localStorage.setItem('elecarm_rev',String(r)); }catch(e){} } }
function loadTeam(){ try{ var t=JSON.parse(localStorage.getItem(KEY)||'null'); return t&&t.teamId&&t.memberId?t:null; }catch(e){ return null; } }
function saveTeam(t){ try{ if(t) localStorage.setItem(KEY, JSON.stringify(t)); else localStorage.removeItem(KEY); }catch(e){} }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function now(){ return Date.now()+offset; }
function fmt(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
  var p=function(n){return (n<10?'0':'')+n;};
  return (h>0?p(h)+':':'')+p(m)+':'+p(x);
}
function setErr(t){ document.getElementById('err').textContent=t||''; }

function canRegister(){ return cur && (cur.status==='waiting' || cur.status==='running'); }

// Partie inscription : TD, puis groupe, puis nom. Re-rendue seulement quand l'etat change
// (le champ du nom n'est jamais recree, la saisie n'est pas perdue).
var selTd=null, selGroup=null;
function tdsOf(teams){ var o=[]; teams.forEach(function(t){ if(t.td && o.indexOf(t.td)<0) o.push(t.td); }); return o; }
function groupLabel(t){ return t.td ? (t.name.replace(t.td+' · ','')) : t.name; }
function pickTd(td){ selTd=td; selGroup=null; setErr(''); lastSig=''; renderTeams(); }
function pickGroup(id){ selGroup=id; setErr(''); lastSig=''; renderTeams(); if(id) setTimeout(function(){ document.getElementById('mname').focus(); },30); }
function show3(n){ ['step-td','step-grp','step-name'].forEach(function(id,i){ document.getElementById(id).style.display=(i===n?'block':'none'); }); }
function renderTeams(){
  var me = cur && cur.me;
  var sig = JSON.stringify([cur&&cur.status, cur&&cur.open, cur&&cur.teams, me, selTd, selGroup]);
  if(sig===lastSig) return; lastSig=sig;
  var reg=document.getElementById('reg'), mine=document.getElementById('mine');
  if(me){
    reg.style.display='none'; mine.style.display='block';
    document.getElementById('me').innerHTML='<b>'+esc(me.team.name)+'</b> ('+me.team.members.length+' / '+me.team.capacity+')<br>'+me.team.members.map(esc).join(', ');
    document.getElementById('leave').style.display = cur.open ? 'none' : 'inline-block';
    return;
  }
  mine.style.display='none';
  if(!canRegister()){ reg.style.display='none'; return; }
  reg.style.display='block';
  var teams=cur.teams.filter(function(t){ return t.td; });
  var tds=tdsOf(teams);
  if(selTd && tds.indexOf(selTd)<0) selTd=null;
  var g=selGroup && teams.filter(function(t){ return t.id===selGroup; })[0];
  if(selGroup && !g) selGroup=null;
  if(!selTd){
    show3(0);
    document.getElementById('tds').innerHTML=tds.length?tds.map(function(td){
      var gs=teams.filter(function(t){ return t.td===td; });
      return '<button class="td" onclick="pickTd(\''+td+'\')">'+esc(td)+'<small>'+gs.length+' groupe'+(gs.length>1?'s':'')+'</small></button>';
    }).join(''):'<div class="empty">Les groupes ne sont pas encore prêts. Cette page se met à jour toute seule.</div>';
    return;
  }
  if(!g){
    show3(1);
    document.getElementById('grp-td').textContent=selTd;
    document.getElementById('grps').innerHTML=teams.filter(function(t){ return t.td===selTd; }).map(function(t){
      var full=t.count>=t.capacity, pct=Math.min(100,Math.round(100*t.count/t.capacity));
      return '<button class="grp" '+(full?'disabled':'')+' onclick="pickGroup(\''+t.id+'\')"><div class="grp-n">'+esc(groupLabel(t))+'</div>'+
        '<div class="grp-c">'+(full?'Complet':t.count+' / '+t.capacity+' places')+'</div><div class="bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="grp-m">'+(t.members.map(esc).join(', ')||'Personne pour le moment')+'</div></button>';
    }).join('');
    return;
  }
  show3(2);
  var gfull=g.count>=g.capacity;
  document.getElementById('pick').textContent=g.name;
  document.getElementById('pick-m').innerHTML=(g.members.length?'Déjà dans le groupe : '+g.members.map(esc).join(', '):'Personne n\'est encore dans ce groupe.')+' ('+g.count+' / '+g.capacity+')';
  var btn=document.getElementById('joinbtn');
  btn.disabled=gfull; btn.textContent=gfull?'Groupe complet':'Rejoindre '+g.name;
}

function join(){
  var name=document.getElementById('mname').value.trim();
  if(!selGroup) return;
  if(!name){ setErr('Indiquez votre nom et prénom.'); document.getElementById('mname').focus(); return; }
  var btn=document.getElementById('joinbtn'); btn.disabled=true;
  setErr('');
  fetch(TEAM_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'join', memberName:name, teamId:selGroup})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(o){
      btn.disabled=false;
      if(!o.ok){ setErr(o.j.message||'Erreur, réessayez.'); return; }
      saveTeam({teamId:o.j.teamId, memberId:o.j.memberId, teamName:o.j.teamName, memberName:o.j.memberName});
      if(o.j.view){ cur=o.j.view; noteRev(o.j.view.rev); }
      selTd=null; selGroup=null; lastSig=''; renderTeams();
    }).catch(function(){ btn.disabled=false; setErr('Serveur injoignable, réessayez.'); });
}

function leave(){
  var t=loadTeam(); if(!t) return;
  ask('Quitter le groupe '+t.teamName+' ?',function(){
  fetch(TEAM_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'leave',teamId:t.teamId,memberId:t.memberId})})
    .then(function(){ saveTeam(null); if(cur) cur.me=undefined; lastSig=''; poll(true); })
    .catch(function(){});
  });
}

function setFoot(){
  if(!cur){ dot.className='dot'; label.textContent='Connexion au serveur...'; return; }
  if(cur.status==='running'){ dot.className='dot live'; label.textContent=cur.open?'Exercice ouvert':'Lancement en cours'; }
  else if(cur.status==='waiting'){ dot.className='dot live'; label.textContent='Salle d\'attente active'; }
  else if(cur.status==='closed'){ dot.className='dot'; label.textContent='Exercice fermé'; }
  else { dot.className='dot'; label.textContent='En veille'; }
}
function launch(){
  if(launched) return; launched=true;
  document.getElementById('mine').style.display='none';
  view.innerHTML='<div class="spin"></div><div class="flash">Ouverture du dossier...</div>';
  setTimeout(function(){ window.location.href=EXO; }, 1300);
}

// Boucle d'affichage rapide (fluide pour le decompte)
var lastView='';
function show(html){ if(html!==lastView){ view.innerHTML=html; lastView=html; } }
function tick(){
  if(launched) return;
  setFoot();
  if(cur){
    var registered=!!cur.me;
    if(cur.status==='running' && cur.endAt){
      var left=cur.endAt-now();
      if(left<=0){
        if(registered && cur.open){ launch(); return; }
        show('<div class="tag">Exercice ouvert</div><div class="status">Rejoignez votre groupe pour entrer</div>');
      } else {
        show('<div class="tag">Lancement en cours</div><div class="status">L\'exercice ouvre dans</div>'+
          '<div class="count">'+fmt(left)+'</div>'+
          '<div class="hint">'+(registered?'Restez sur cette page. L\'ouverture est automatique et synchronisée pour tous les groupes.':'Rejoignez votre groupe avant la fin du compte à rebours.')+'</div>');
      }
    } else if(cur.status==='waiting'){
      show('<div class="tag">Dossier confidentiel - usage restreint</div><div class="spin"></div>'+
        '<div class="status">En attente du lancement</div>'+
        '<div class="hint">'+(registered?'Gardez cette page ouverte. Le compte à rebours démarrera dès que l\'enseignant lancera la session.':'Commencez par rejoindre votre groupe ci-dessus.')+'</div>');
    } else if(cur.status==='closed'){
      show('<div class="tag">Dossier confidentiel - usage restreint</div><div class="status">Exercice fermé</div>'+
        '<div class="hint">L\'enseignant a fermé l\'exercice. Cette page se met à jour toute seule.</div>');
    } else {
      show('<div class="tag">Dossier confidentiel - usage restreint</div><div class="status">Session non ouverte</div>'+
        '<div class="hint">La session n\'a pas encore été ouverte par l\'enseignant. Cette page se met à jour toute seule.</div>');
    }
  }
  setTimeout(tick, 250);
}

// Boucle d'interrogation de l'etat partage
function poll(once){
  var t=loadTeam();
  var q=(t?('&team='+encodeURIComponent(t.teamId)+'&member='+encodeURIComponent(t.memberId)):'')+'&minRev='+seenRev();
  var sent=Date.now();
  fetch(API+'?ts='+sent+q,{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(st){
      if(st && typeof st.status==='string'){
        if(st.serverNow) offset=st.serverNow-Math.round((sent+Date.now())/2);
        noteRev(st.rev);
        // Retire de l'equipe par l'animateur : confirme sur deux reponses consecutives avant d'oublier l'inscription.
        if(t && st.me===null){ goneCount++; if(goneCount>=2){ saveTeam(null); goneCount=0; } else { st.me=cur&&cur.me; } }
        else goneCount=0;
        // Déplacé par l'animateur : le poste suit son nouveau groupe.
        if(t && st.me && st.me.team.id!==t.teamId){ t.teamId=st.me.team.id; t.teamName=st.me.team.name; saveTeam(t); }
        cur=st; renderTeams();
      }
    }).catch(function(){})
    .then(function(){ if(!launched && !once) setTimeout(poll, POLL); });
}
tick(); poll();
</script>
</body>
</html>
